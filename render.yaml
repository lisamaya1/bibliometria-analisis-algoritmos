services:
  - type: web
    name: bibliometria-analisis-algoritmos
    runtime: docker
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    numInstances: 1
    # Suficiente para una demostración de bajo tráfico. Puede suspenderse por inactividad.
    plan: free
    envVars:
      - key: MINILM_MODEL_DIR
        value: /opt/models/minilm
      - key: BGE_MODEL_DIR
        value: /opt/models/bge
      - key: JAVA_TOOL_OPTIONS
        value: "-XX:InitialRAMPercentage=10.0 -XX:MaxRAMPercentage=40.0 -XX:+ExitOnOutOfMemoryError"
